name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Absolute path. The dbt SQLFluff templater opens DuckDB while compiling.
      # An empty file is enough; compilation does not read warehouse tables.
      WAREHOUSE_TARGET: duckdb
      DUCKDB_PATH: ${{ github.workspace }}/warehouse/analytics.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check generator ingest scripts airflow streaming
      - name: SQLFluff
        run: sqlfluff lint transform/models transform/macros transform/snapshots transform/tests

  dbt-duckdb:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      WAREHOUSE_TARGET: duckdb
      DUCKDB_PATH: ${{ github.workspace }}/warehouse/analytics.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline dependencies
        run: pip install -r requirements.txt
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create the app schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f app_db/init/001_app_schema.sql
      - name: Seed, ingest, and build
        run: |
          python -m generator --mode seed --seed 42
          python -m ingest --target duckdb
          ./scripts/dbt_build.sh
      - name: Failure demo, then heal
        run: |
          python -m scripts.break_it
          python -m scripts.heal_it
      - name: CDC overlap in staging
        run: python -m streaming.overlap_check

  consumer-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline dependencies
        run: pip install -r requirements.txt pytest==8.3.5
      - name: Consumer dedup tests
        run: python -m pytest streaming/tests -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: Format
        working-directory: infra/snowflake
        run: terraform fmt -check -recursive
      - name: Init and validate
        working-directory: infra/snowflake
        run: |
          terraform init -backend=false
          terraform validate

  compose-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Start Phase 1 Postgres from the compose file
        run: |
          set -euxo pipefail
          if ! docker compose up -d --wait --wait-timeout 120 postgres; then
            docker compose logs postgres
            docker inspect saas-analytics-postgres-1 || true
            exit 1
          fi
      - name: App schema and Airflow database exist
        run: |
          set -euxo pipefail
          docker compose exec -T postgres psql -U app -d app -v ON_ERROR_STOP=1 -c '\dt app.*'
          tables=$(docker compose exec -T postgres psql -U app -d app -v ON_ERROR_STOP=1 -tA -c \
            "SELECT table_name FROM information_schema.tables WHERE table_schema = 'app' ORDER BY 1")
          expected=$(printf '%s\n' invoices logins organizations subscription_events subscriptions users)
          if [ "$tables" != "$expected" ]; then
            echo "unexpected app tables:"
            printf '%s\n' "$tables"
            exit 1
          fi
          docker compose exec -T postgres psql -U app -d postgres -v ON_ERROR_STOP=1 -tA -c \
            "SELECT 1 FROM pg_database WHERE datname = 'airflow'" | grep -qx 1
          docker compose exec -T postgres psql -U app -d app -v ON_ERROR_STOP=1 -tA -c \
            "SELECT count(*) FROM pg_publication WHERE pubname = 'app_publication'" | grep -qx 0
      - name: cdc-prepare on the existing Phase 1 volume
        run: |
          set -euxo pipefail
          if ! docker compose -f docker-compose.yml -f docker-compose.cdc.yml up -d --wait --wait-timeout 120 postgres; then
            docker compose logs postgres
            exit 1
          fi
          make cdc-prepare
          make cdc-prepare
          docker compose exec -T postgres psql -U app -d app -v ON_ERROR_STOP=1 -tA -c \
            "SELECT rolname FROM pg_roles WHERE rolname = 'replicator'" | grep -qx replicator
          docker compose exec -T postgres psql -U app -d app -v ON_ERROR_STOP=1 -tA -c \
            "SELECT pubname FROM pg_publication WHERE pubname = 'app_publication'" | grep -qx app_publication
      - name: cdc-prepare on a fresh CDC volume
        run: |
          set -euxo pipefail
          docker compose -f docker-compose.yml -f docker-compose.cdc.yml down -v
          if ! docker compose -f docker-compose.yml -f docker-compose.cdc.yml up -d --wait --wait-timeout 120 postgres; then
            docker compose -f docker-compose.yml -f docker-compose.cdc.yml logs postgres
            exit 1
          fi
          make cdc-prepare
          make cdc-prepare
          docker compose exec -T postgres psql -U app -d app -v ON_ERROR_STOP=1 -tA -c \
            "SELECT pubname FROM pg_publication WHERE pubname = 'app_publication'" | grep -qx app_publication
          docker compose -f docker-compose.yml -f docker-compose.cdc.yml down -v
      - name: Base compose boots a volume that already has a logical slot
        run: |
          set -euxo pipefail
          if ! docker compose -f docker-compose.yml -f docker-compose.cdc.yml up -d --wait --wait-timeout 120 postgres; then
            docker compose -f docker-compose.yml -f docker-compose.cdc.yml logs postgres
            exit 1
          fi
          make cdc-prepare
          docker compose -f docker-compose.yml -f docker-compose.cdc.yml exec -T postgres \
            psql -U app -d app -v ON_ERROR_STOP=1 -c \
            "SELECT pg_create_logical_replication_slot('saas_app_slot', 'pgoutput')"
          docker compose -f docker-compose.yml -f docker-compose.cdc.yml stop postgres
          if ! docker compose up -d --wait --wait-timeout 120 postgres; then
            docker compose logs postgres
            docker inspect saas-analytics-postgres-1 || true
            exit 1
          fi
          docker inspect -f '{{.State.Health.Status}}' saas-analytics-postgres-1 | grep -qx healthy
          docker compose exec -T postgres psql -U app -d app -v ON_ERROR_STOP=1 -tA -c \
            "SHOW wal_level" | grep -qx logical
          docker compose exec -T postgres psql -U app -d app -v ON_ERROR_STOP=1 -tA -c \
            "SELECT slot_name FROM pg_replication_slots WHERE slot_name = 'saas_app_slot'" | grep -qx saas_app_slot
          make cdc-reset
          make cdc-reset
          docker compose exec -T postgres psql -U app -d app -v ON_ERROR_STOP=1 -tA -c \
            "SELECT count(*) FROM pg_replication_slots WHERE slot_name = 'saas_app_slot'" | grep -qx 0
          docker compose down --remove-orphans -v

  compose-cdc-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the CDC profile images
        run: |
          set -euxo pipefail
          docker compose -f docker-compose.yml -f docker-compose.cdc.yml --profile cdc build
          docker compose -f docker-compose.yml -f docker-compose.cdc.yml --profile cdc-python build
      - name: Spark consumer imports pyspark, duckdb, and streaming
        run: |
          set -euxo pipefail
          docker compose -f docker-compose.yml -f docker-compose.cdc.yml --profile cdc run --no-deps --rm \
            --entrypoint /opt/py/bin/python spark-consumer -c \
            'import os, sys, pyspark, duckdb, streaming; assert sys.version_info[:2] == (3, 12); assert os.environ["PYSPARK_PYTHON"] == "/opt/py/bin/python"; assert os.environ["PYSPARK_DRIVER_PYTHON"] == "/opt/py/bin/python"; print(pyspark.__version__); print(duckdb.__version__)'
      - name: Python consumer imports duckdb and streaming
        run: |
          set -euxo pipefail
          docker compose -f docker-compose.yml -f docker-compose.cdc.yml --profile cdc-python run --no-deps --rm \
            --entrypoint python python-consumer -c \
            'import duckdb, kafka, streaming; print(duckdb.__version__)'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Airflow ingest opens a DuckDB file created on the host
        run: |
          set -euxo pipefail
          python -m pip install 'duckdb==1.5.5'
          mkdir -p warehouse
          python - <<'PY'
          import duckdb
          con = duckdb.connect("warehouse/analytics.duckdb")
          con.execute("create table host_marker (id integer)")
          con.execute("insert into host_marker values (1)")
          con.close()
          PY
          chmod 644 warehouse/analytics.duckdb
          host_uid=$(id -u)
          echo "AIRFLOW_UID=${host_uid}" >> .env
          if ! docker compose up -d --wait --wait-timeout 180 postgres; then
            docker compose logs postgres
            exit 1
          fi
          # bash is dispatched by the image entrypoint after the metadata DB check.
          # A path that is not exactly "bash" or "python" would be wrapped as `airflow`.
          docker compose run --rm --no-deps airflow bash -lc \
            "set -euo pipefail; test \"\$(id -u)\" = \"${host_uid}\"; test \"\$(id -g)\" = 0; test -x /opt/pipeline-venv/bin/python; /opt/pipeline-venv/bin/python -c 'import duckdb, sys; print(sys.executable)'; /opt/pipeline-venv/bin/python -m ingest --target duckdb"
          python - <<'PY'
          import duckdb
          con = duckdb.connect("warehouse/analytics.duckdb", read_only=True)
          marker = con.execute("select id from host_marker").fetchall()
          if marker != [(1,)]:
              raise SystemExit(f"host marker missing: {marker}")
          names = {
              row[0]
              for row in con.execute(
                  "select table_name from information_schema.tables where table_schema = 'raw'"
              ).fetchall()
          }
          need = {
              "organizations",
              "users",
              "subscriptions",
              "subscription_events",
              "logins",
              "invoices",
              "_ingest_state",
          }
          missing = need - names
          if missing:
              raise SystemExit(f"missing raw tables: {sorted(missing)}")
          con.close()
          PY

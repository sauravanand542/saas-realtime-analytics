# CDC add-on. Use it with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.cdc.yml --profile cdc up
# `make up` does not load this file, so Phase 1 stays Postgres + Airflow.
#
# mem_limit values are caps, not a measurement of resident memory.
# Phase 1 caps stay 512 MB (Postgres) and 1536 MB (Airflow).
# This profile adds Kafka 768 MB, Connect 1024 MB, and Spark 1536 MB.
# `make cdc-up-python` swaps the Spark container for a 384 MB Python consumer.

name: saas-analytics

services:
  postgres:
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4

  airflow:
    environment:
      CDC_CONNECT_URL: http://connect:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  kafka:
    image: apache/kafka:3.9.2
    profiles: ["cdc", "cdc-python"]
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  connect:
    image: quay.io/debezium/connect:3.6.2.Final
    profiles: ["cdc", "cdc-python"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: saas-connect
      CONFIG_STORAGE_TOPIC: saas_connect_configs
      OFFSET_STORAGE_TOPIC: saas_connect_offsets
      STATUS_STORAGE_TOPIC: saas_connect_statuses
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
      REST_HOST_NAME: 0.0.0.0
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  spark-consumer:
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["cdc"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CDC_CONNECT_URL: http://connect:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WAREHOUSE_TARGET: ${WAREHOUSE_TARGET:-duckdb}
      DUCKDB_PATH: /opt/project/warehouse/analytics.duckdb
      CDC_CHECKPOINT: /opt/project/warehouse/cdc_checkpoints
      PYTHONPATH: /opt/project
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-ANALYTICS_WH}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-ANALYTICS}
      SNOWFLAKE_LOADER_ROLE: ${SNOWFLAKE_LOADER_ROLE:-LOADER}
    volumes:
      - ./:/opt/project
    mem_limit: 1536m
    restart: unless-stopped
    command:
      - bash
      - /opt/project/scripts/run_consumer.sh
      - /opt/spark/bin/spark-submit
      - --master
      - local[1]
      - --driver-memory
      - 768m
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5
      - /opt/project/streaming/spark_consumer.py

  python-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    profiles: ["cdc-python"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CDC_CONNECT_URL: http://connect:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WAREHOUSE_TARGET: ${WAREHOUSE_TARGET:-duckdb}
      DUCKDB_PATH: /opt/project/warehouse/analytics.duckdb
      PYTHONPATH: /opt/project
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-ANALYTICS_WH}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-ANALYTICS}
      SNOWFLAKE_LOADER_ROLE: ${SNOWFLAKE_LOADER_ROLE:-LOADER}
    volumes:
      - ./:/opt/project
    mem_limit: 384m
    restart: unless-stopped
    command:
      - bash
      - /opt/project/scripts/run_consumer.sh
      - python
      - -m
      - streaming.python_consumer

version: 2

sources:
  - name: app
    description: >
      Batch landing for the production app database (_source_system =
      postgres_batch). One current row per key. The CDC feed lands in the
      app_cdc source instead, and staging chooses the later version.
    schema: raw
    loader: ingest
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 36, period: hour}
      error_after: {count: 72, period: hour}
    tables:
      - name: organizations
        description: Current organization records. Reloaded in full each batch.
      - name: users
        description: Current users. Email is nullable in the source.
      - name: subscriptions
        description: >
          Current subscription row per organization. Plan text is not
          normalized here. This is the snapshot source, after staging cleanup.
      - name: subscription_events
        description: >
          Append-only commercial events. occurred_at is business time.
          recorded_at is when the app stored the row and is the ingest watermark.
      - name: logins
        description: >
          SSO login attempts. client_event_id can repeat when the client
          retries. logged_in_at can be earlier than recorded_at.
      - name: invoices
        description: Billing documents. Status can change after issue, which bumps recorded_at.

  - name: app_cdc
    description: >
      Append-only Debezium landing (_source_system = debezium). One row per
      primary key and dedup token. Staging keeps the latest row per key and
      drops the key when that row is a delete. Freshness is not checked here:
      a quiet app produces no events, and that must not block the batch DAG.
      Use `python -m streaming.lag` for consumer lag and source-to-warehouse delay.
    schema: raw
    loader: debezium
    tables:
      - name: organizations_cdc
        description: Change log for organizations, including deletes and snapshot reads.
      - name: users_cdc
        description: Change log for users.
      - name: subscriptions_cdc
        description: Change log for the current subscription row.
      - name: subscription_events_cdc
        description: Change log for commercial events.
      - name: logins_cdc
        description: Change log for SSO login attempts.
      - name: invoices_cdc
        description: Change log for invoices.
